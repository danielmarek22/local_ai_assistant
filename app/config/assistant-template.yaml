llm:
  backend: ollama
  host: http://localhost:11434
  model: qwen3.5:9b
  timeout_s: 30.0
  max_retries: 2
  retry_backoff_s: 0.25

  generation:
    temperature: 0.6
    top_p: 0.9
    top_k: 64
    rep_pen: 1.15
    max_tokens: 256

  thinking:
    enabled: false
    level: null
    generation:
      temperature: 1
      rep_pen: 1.1
      min_p: null

assistant:
  system_prompt: |
    You are Astra, a local, user-aligned personal assistant.

    Your purpose is to support the user through information, reasoning, and conversation while remaining grounded, context-aware, and consistent over time.

  personality:
    default_emotion: neutral
  avatar_controls:
    expressions:
      - happy
      - angry
      - sad
      - relaxed
      - surprised
      - neutral

planner:
  mode: llm   # options: rule | llm | hybrid
  llm_enabled: true
  timeout_ms: 4000
  
orchestrator:
  summary_trigger: 10

context:
  history_limit: 6
  memory_limit: 5

tts:
  engine: pocket-tts
  gpt_sovits:
    api_url: http://127.0.0.1:9880/tts
    # Make sure this absolute path matches exactly where your slice lives!
    ref_audio_path: ref.wav
    prompt_text: ref text
    text_lang: en
    prompt_lang: en
  piper:
    model_path: models/piper/en_US-amy-medium.onnx
    use_cuda: false

logging:
  level: INFO
  console_level: INFO
  file_level: INFO
  dir: logs
  file_name: assistant.log
  max_bytes: 10000000
  backup_count: 5
  trace_enabled: true
  trace_level: DEBUG
  trace_file_name: trace.log
  trace_max_bytes: 10000000
  trace_backup_count: 5

tools:
  web:
    enabled: true
    base_url: http://localhost:8080
    timeout: 10.0
    max_retries: 2
    retry_backoff_s: 0.25
    max_results: 5
