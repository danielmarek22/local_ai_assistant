llm:
  backend: ollama
  host: http://localhost:11434
  model: gemma4:12b-it-qat
  timeout_s: 30.0
  max_retries: 2
  retry_backoff_s: 0.25

  generation:
    temperature: 0.6
    top_p: 0.9
    top_k: 64
    rep_pen: 1.15
    max_tokens: 256

  thinking:
    enabled: false
    level: null
    generation:
      temperature: 1
      rep_pen: 1.1
      min_p: null

local_human:
  id: local-human
  display_name: You

assistant:
  id: default-agent
  display_name: Astra
  system_prompt: |
    You are Astra, a local, user-aligned personal assistant.

    Your purpose is to support the user through information, reasoning, and conversation while remaining grounded, context-aware, and consistent over time.

  personality:
    default_emotion: neutral
  avatar_controls:
    default_outfit: default
    expressions:
      - happy
      - angry
      - sad
      - relaxed
      - surprised
      - neutral

planner:
  mode: llm   # options: rule | llm | hybrid
  llm_enabled: true
  timeout_ms: 4000
  
orchestrator:
  summary_trigger: 10

context:
  history_limit: 6
  injected_memory_limit: 5
  integration_context_limit: 4000

beliefs:
  enabled: true
  processing_mode: disabled  # disabled | observer | react_tool
  timezone: UTC
  max_candidates: 4
  max_existing_beliefs: 24
  max_snapshot_chars: 2000
  max_disambiguating_context_chars: 1000
  max_generation_tokens: 384
  timeout_s: 30.0
  max_expiry_days: 90

autonomy:
  enabled: false
  max_chain_events: 20
  max_chain_age_s: 1800
  max_queue_size: 256
  max_tool_steps: 5
  global_llm_concurrency: 1
  approval_timeout_s: 300
  recent_context_limit: 4000

tts:
  engine: pocket-tts
  gpt_sovits:
    api_url: http://127.0.0.1:9880/tts
    # Make sure this absolute path matches exactly where your slice lives!
    ref_audio_path: ref.wav
    prompt_text: ref text
    text_lang: en
    prompt_lang: en
  piper:
    model_path: models/piper/en_US-amy-medium.onnx
    use_cuda: false

stt:
  enabled: true
  model_size: small   # tiny/base/small/medium — small is the sweet spot for local
  device: cpu
  compute_type: int8
  vad_filter: true
  vad_parameters:
    min_silence_duration_ms: 300

voice_input:
  path: stt   # options: stt | native_audio
  native_audio:
    # Ollama Gemma 4 currently accepts WAV audio through the multimodal media slot.
    # Use "audios" here if your backend exposes a dedicated audio field.
    payload_field: images
    prompt_text: Please answer the user's spoken audio.
    display_text: Voice message
    convert_to_wav: true
    sample_rate: 16000

vision_watchdog:
  model: HuggingFaceTB/SmolVLM-256M-Instruct
  device: auto
  torch_dtype: auto
  attn_implementation: auto
  max_new_tokens: 8

logging:
  level: INFO
  console_level: INFO
  file_level: INFO
  dir: logs
  file_name: assistant.log
  max_bytes: 10000000
  backup_count: 5
  trace_enabled: true
  trace_level: DEBUG
  trace_file_name: trace.log
  trace_max_bytes: 10000000
  trace_backup_count: 5

integrations:
  web:
    enabled: true
    base_url: http://localhost:8080
    timeout: 10.0
    max_retries: 2
    retry_backoff_s: 0.25
    max_results: 5
  memory:
    enabled: true
  shell:
    enabled: true
    timeout: 15
  mindcraft:
    enabled: false
    url: http://localhost:8081
    agent_name: ""
    connect_timeout: 3.0
    reconnect_delay_s: 2.0
    reconnect_max_delay_s: 30.0
    context_enabled: true
    recent_output_limit: 3
    events_enabled: true
    ambient_session_id: ""
    autonomous_events: [critical_health, died, disconnected]
    attachment_dir: static/uploads/events/mindcraft
